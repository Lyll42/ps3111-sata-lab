[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps3111-sata-lab"
version = "0.1.0a1"
description = "Experimental Windows SATA transport study and guarded IDENTIFY diagnostics"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"

[project.scripts]
ps3111-sata = "ps3111_sata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
